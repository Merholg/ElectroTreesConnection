openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ElectroTreesConnection API for electrical panel connection trees
servers:
  - url: /api
tags:
  - name: health
  - name: branch-types
  - name: branches
  - name: nodes
  - name: points
  - name: trace
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Connection tree overview
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /branch-types:
    get:
      operationId: listBranchTypes
      tags: [branch-types]
      responses:
        "200":
          description: Branch types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchType"
    post:
      operationId: createBranchType
      tags: [branch-types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchType"

  /branch-types/{id}:
    patch:
      operationId: updateBranchType
      tags: [branch-types]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchTypeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchType"
    delete:
      operationId: deleteBranchType
      tags: [branch-types]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: branchTypeId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /branches/{id}:
    get:
      operationId: getBranch
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    patch:
      operationId: updateBranch
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    delete:
      operationId: deleteBranch
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/{id}:
    patch:
      operationId: updateNode
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /points:
    get:
      operationId: listPoints
      tags: [points]
      responses:
        "200":
          description: Coordinate points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Point"
    post:
      operationId: createPoint
      tags: [points]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Point"

  /points/{id}:
    patch:
      operationId: updatePoint
      tags: [points]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Point"
    delete:
      operationId: deletePoint
      tags: [points]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /branches/{branchId}/trace:
    get:
      operationId: listTracePoints
      tags: [trace]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Ordered branch trace points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TracePoint"
    post:
      operationId: createTracePoint
      tags: [trace]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TracePointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TracePoint"

  /trace/{branchId}/{pointOrder}:
    delete:
      operationId: deleteTracePoint
      tags: [trace]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: number }
        - name: pointOrder
          in: path
          required: true
          schema: { type: number }
      responses:
        "204": { description: Deleted }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: number }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    BranchType:
      type: object
      required: [branchTypeId, branchTypeDescr]
      properties:
        branchTypeId: { type: number }
        branchTypeDescr: { type: string }
    BranchTypeInput:
      type: object
      required: [branchTypeDescr]
      properties:
        branchTypeDescr: { type: string, minLength: 1 }
    Branch:
      type: object
      required: [branchId, branchName, branchBeginNode, branchEndNode, branchTypeId, branchTypeDescr]
      properties:
        branchId: { type: number }
        branchName: { type: string }
        branchBeginNode: { type: number }
        branchEndNode: { type: number }
        branchTypeId: { type: number }
        branchTypeDescr: { type: string }
    BranchInput:
      type: object
      required: [branchName, branchBeginNode, branchEndNode, branchTypeId]
      properties:
        branchName: { type: string, minLength: 1 }
        branchBeginNode: { type: number }
        branchEndNode: { type: number }
        branchTypeId: { type: number }
    Node:
      type: object
      required: [nodeId, nodeName, pointId, pointCoordX, pointCoordY]
      properties:
        nodeId: { type: number }
        nodeName: { type: string }
        pointId: { type: number }
        pointCoordX: { type: number }
        pointCoordY: { type: number }
    NodeInput:
      type: object
      required: [nodeName, pointId]
      properties:
        nodeName: { type: string, minLength: 1 }
        pointId: { type: number }
    Point:
      type: object
      required: [pointId, pointCoordX, pointCoordY]
      properties:
        pointId: { type: number }
        pointCoordX: { type: number }
        pointCoordY: { type: number }
    PointInput:
      type: object
      required: [pointCoordX, pointCoordY]
      properties:
        pointCoordX: { type: number }
        pointCoordY: { type: number }
    TracePoint:
      type: object
      required: [pointOrder, branchId, pointId, pointCoordX, pointCoordY]
      properties:
        pointOrder: { type: number }
        branchId: { type: number }
        pointId: { type: number }
        pointCoordX: { type: number }
        pointCoordY: { type: number }
    TracePointInput:
      type: object
      required: [pointOrder, pointId]
      properties:
        pointOrder: { type: number }
        pointId: { type: number }
    Dashboard:
      type: object
      required: [branchTypeCount, branchCount, nodeCount, pointCount, tracePointCount, rootNodes, branchTypeBreakdown]
      properties:
        branchTypeCount: { type: number }
        branchCount: { type: number }
        nodeCount: { type: number }
        pointCount: { type: number }
        tracePointCount: { type: number }
        rootNodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        branchTypeBreakdown:
          type: array
          items:
            type: object
            required: [branchTypeId, branchTypeDescr, branchCount]
            properties:
              branchTypeId: { type: number }
              branchTypeDescr: { type: string }
              branchCount: { type: number }