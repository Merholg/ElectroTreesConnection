kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["python", "-m", "py_compile", "artifacts/api-server/src/main.py"]


[services.production.run]
# Serve Flask with a production WSGI server.
args = ["python", "-m", "gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1", "--chdir", "artifacts/api-server/src", "main:app"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
